
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071427">
<title>資訊漣漪｜數位公民挑戰</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --bg: #071427;
  --panel: #10243c;
  --panel2: #172f4c;
  --cyan: #6be8ff;
  --gold: #f3d28d;
  --white: #f3f9ff;
  --muted: #b1c5d8;
  --green: #49d9ac;
  --red: #ff7386;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--white);
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
}

button, input, select { font: inherit; }
button { cursor: pointer; }

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
}

#tech-background {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

#app {
  width: min(1180px, calc(100% - 32px));
  margin: 36px auto 90px;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 345px;
  gap: 26px;
  align-items: start;
}

.card {
  padding: 32px;
  border: 1px solid rgba(107,232,255,.24);
  border-radius: 24px;
  background: linear-gradient(
    145deg,
    rgba(16,36,60,.96),
    rgba(9,24,43,.94)
  );
  box-shadow: 0 20px 60px #0005;
  backdrop-filter: blur(16px);
}

.intro {
  min-height: 75vh;
  display: grid;
  place-items: center;
}

.intro .card {
  width: min(790px, 100%);
  text-align: center;
  padding: 65px 48px;
}

h1 {
  margin: 14px 0;
  font-size: clamp(48px, 8vw, 92px);
  letter-spacing: .12em;
  background: linear-gradient(100deg, #fff, #7deeff, #f4d18c);
  color: transparent;
  background-clip: text;
}

h2 {
  font-size: clamp(24px, 3.5vw, 34px);
  line-height: 1.5;
  margin: 12px 0 20px;
}

h3 { font-size: 19px; margin: 16px 0; }

p {
  line-height: 1.9;
  color: var(--muted);
}

.eyebrow {
  color: var(--cyan);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .17em;
}

.progress {
  height: 6px;
  margin: 14px 0 22px;
  background: #203b55;
  border-radius: 20px;
  overflow: hidden;
}

.progress > div {
  height: 100%;
  background: linear-gradient(90deg, #4f8dff, #6be8ff);
  transition: width .4s;
}

.btn, .choice {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 20px;
  margin: 5px;
  color: var(--white);
  background: #24435f;
  border: 1px solid #4a7796;
  border-radius: 12px;
  transition: background .2s, transform .2s;
}

.btn:hover, .choice:hover {
  background: #315b7d;
  border-color: var(--cyan);
  transform: translateY(-2px);
}

.btn.primary {
  background: linear-gradient(110deg, #176fa0, #239ab3);
  border-color: #60dfff;
  font-weight: 800;
}

.btn.good {
  background: #176e60;
  border-color: #44d8b0;
}

.btn.danger {
  background: #793047;
  border-color: #ff8597;
}

.actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 22px;
}

.actions .btn, .choice {
  width: 100%;
  margin: 0;
  justify-content: flex-start;
  text-align: left;
}

.choice {
  display: block;
  margin: 10px 0;
  line-height: 1.6;
}

.post, .notice, .history-item {
  padding: 19px;
  border: 1px solid #315471;
  border-radius: 15px;
  background: rgba(28,54,80,.72);
  margin: 18px 0;
}

.post small { color: var(--cyan); }
.post p { color: #f0f8ff; }

.notice {
  border-left: 4px solid var(--cyan);
  line-height: 1.8;
  color: #d9edf8;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.stat {
  padding: 14px 10px;
  text-align: center;
  background: #12283fdf;
  border: 1px solid #2b5471;
  border-radius: 14px;
}

.stat small {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.stat strong {
  font-size: 27px;
  color: var(--cyan);
}

.field {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0 17px;
  border: 1px solid #7194ad;
  border-radius: 10px;
  background: #eaf5ff;
  color: #11283c;
}

.cert-preview {
  width: 100%;
  margin: 16px 0;
  border: 1px solid var(--gold);
  border-radius: 10px;
}

.history-item h3 { color: var(--cyan); }

/* ===== 模擬手機 ===== */

.phone-col {
  position: sticky;
  top: 20px;
  min-width: 0;
}

.phone {
  width: 100%;
  height: 660px;
  position: relative;
  overflow: hidden;
  border: 7px solid #253d56;
  border-radius: 37px;
  background: #101b30;
  box-shadow: 0 20px 50px #0009, 0 0 0 2px #53718c;
}

.statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 42px;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: white;
  background: #14243b;
  font-size: 11px;
  cursor: pointer;
}

.notch {
  width: 70px;
  height: 16px;
  background: #050b15;
  border-radius: 0 0 14px 14px;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}

.screen {
  position: absolute;
  inset: 42px 0 28px;
  overflow: hidden;
  background: linear-gradient(155deg, #173e63, #101f39 60%, #193858);
}

.homebar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 28px;
  display: grid;
  place-items: center;
  background: #101b30;
}

.homebar button {
  width: 95px;
  height: 5px;
  padding: 0;
  background: #e8f0fa;
  border: 0;
  border-radius: 8px;
}

.desktop {
  height: 100%;
  padding: 50px 18px 15px;
  text-align: center;
  overflow-y: auto;
  background:
    radial-gradient(circle at 65% 20%, #378ab244, transparent 45%),
    linear-gradient(150deg, #17456a, #12263f 75%);
}

.desktop-time {
  font-size: 52px;
  font-weight: 800;
}

.desktop-date {
  font-size: 12px;
  color: #b9d4e9;
}

.apps {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px 16px;
  margin-top: 62px;
}

.appicon {
  border: 0;
  background: transparent;
  color: white;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}

.appicon span {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: linear-gradient(140deg, #2d9cb5, #27518e);
  box-shadow: 0 8px 18px #0004;
}

.desktop-tip {
  margin-top: 55px;
  font-size: 11px;
  color: #c2d7e7;
}

.page {
  height: 100%;
  padding: 15px;
  overflow-y: auto;
  background: #f0f5fa;
  color: #203549;
}

.page h3 { font-size: 16px; }
.page p { color: #42566b; font-size: 13px; }

.apphead {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  padding-bottom: 12px;
  border-bottom: 1px solid #cbd7e3;
}

.mini {
  border: 0;
  background: #dce8f3;
  color: #1d425d;
  padding: 8px;
  border-radius: 9px;
  font-size: 12px;
}

.item {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #d5e1eb;
  border-radius: 12px;
  background: white;
  color: #253d51;
  text-align: left;
  line-height: 1.6;
  font-size: 13px;
}

.item small {
  display: block;
  color: #5585a0;
  font-size: 11px;
}

.article {
  padding: 15px;
  background: white;
  border-radius: 13px;
}

.chathead {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.avatar {
  width: 39px;
  height: 39px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #c7ddec;
}

.bubbles {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bubble {
  align-self: flex-start;
  max-width: 88%;
  padding: 9px 13px;
  border-radius: 14px 14px 14px 3px;
  background: white;
  box-shadow: 0 2px 6px #0001;
}

.bubble.mine {
  align-self: flex-end;
  border-radius: 14px 14px 3px 14px;
  background: #b9f3d5;
}

.bubble small {
  font-size: 10px;
  color: #4c788a;
}

.bubble p {
  margin: 3px 0;
  color: #23384a;
  line-height: 1.6;
  font-size: 12px;
}

/* ===== 通知中心 ===== */

.shade {
  position: absolute;
  inset: 0;
  z-index: 80;
  padding: 15px;
  overflow-y: auto;
  color: #fff;
  background: rgba(21,35,56,.98);
  transform: translateY(-105%);
  transition: transform .3s ease;
  pointer-events: none;
}

.shade.open {
  transform: translateY(0);
  pointer-events: auto;
}

.shade-handle {
  width: 50px;
  height: 5px;
  margin: 0 auto 18px;
  background: #8196ad;
  border-radius: 10px;
}

.tiles {
  display: flex;
  gap: 9px;
  margin: 17px 0;
}

.tile {
  flex: 1;
  padding: 13px 6px;
  background: #365473;
  border-radius: 12px;
  font-size: 11px;
  text-align: center;
}

.notification {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 9px 0;
  border: 1px solid #ffffff24;
  border-radius: 14px;
  background: #40536d;
  color: white;
  text-align: left;
}

.notification small {
  display: block;
  color: #c4d2df;
  font-size: 10px;
}

.notification strong {
  display: block;
  margin: 4px 0;
  font-size: 12px;
}

.notification p {
  color: #eef5fc;
  font-size: 11px;
  margin: 0;
  line-height: 1.6;
}

.phone-backdrop,
.phone-launcher {
  display: none;
}

/* ===== 真實頂部橫幅通知 ===== */

.live-notification {
  position: absolute;
  top: 8px;
  left: 10px;
  right: 10px;
  z-index: 120;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px;
  border: 1px solid #ffffff35;
  border-radius: 17px;
  background: rgba(48,64,85,.97);
  color: #fff;
  box-shadow: 0 12px 25px #0007;
  backdrop-filter: blur(18px);
  cursor: pointer;
  transform: translateY(-150%);
  opacity: 0;
  animation: bannerIn .4s ease forwards;
}

.live-notification.hide {
  animation: bannerOut .38s ease forwards;
}

.live-notification-icon {
  flex: 0 0 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: #218b72;
  font-size: 21px;
}

.live-notification-content {
  flex: 1;
  min-width: 0;
}

.live-notification-title {
  font-size: 12px;
  font-weight: 800;
  margin-bottom: 4px;
}

.live-notification-body {
  font-size: 11px;
  line-height: 1.5;
  color: #e2edf7;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  overflow: hidden;
}

.live-notification-time {
  font-size: 10px;
  color: #c3d2df;
}

@keyframes bannerIn {
  from {
    transform: translateY(-150%);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes bannerOut {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-150%);
    opacity: 0;
  }
}

/* ===== 來電畫面：保留深藍科技風 ===== */

.call {
  position: relative;
  height: 100%;
  padding: 58px 20px 24px;
  text-align: center;
  color: white;
  background: linear-gradient(
    165deg,
    #293d5c 0%,
    #1c2b48 65%,
    #111d35 100%
  );
}

.call-avatar {
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
  margin: 15px auto 25px;
  border-radius: 50%;
  background: #536a85;
  box-shadow: 0 0 0 19px #ffffff12;
  font-size: 55px;
}

.ringing .call-avatar {
  animation: ringPulse 1.3s ease-in-out infinite;
}

.call-name {
  font-size: 23px;
  font-weight: 800;
}

.call-number {
  font-size: 13px;
  color: #c4d6e8;
  margin-top: 10px;
}

.call-status {
  margin: 25px 0;
  color: #a5d4e5;
}

.call-actions {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 82px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 55px;
}

.call-btn {
  width: 72px;
  height: 72px;
  border: 0;
  border-radius: 50%;
  color: white;
  font-size: 30px;
  box-shadow: 0 10px 24px #0006;
  transition: filter .2s, box-shadow .2s;
}

.call-btn.reject {
  background: #d85567;
  animation: rejectFloat 2.5s ease-in-out infinite;
}

.call-btn.accept {
  background: #59b87d;
  animation: acceptFloat 2.5s ease-in-out infinite;
}

.call-btn:hover {
  filter: brightness(1.15);
  box-shadow: 0 14px 32px #0008;
}

@keyframes rejectFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes acceptFloat {
  0%, 100% { transform: translateY(-12px); }
  50% { transform: translateY(0); }
}

@keyframes ringPulse {
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 0 26px #ffffff13;
  }
}

.voice-indicator {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 28px;
  color: #a7c5dc;
  font-size: 11px;
}

.voice-waves {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 22px;
  margin: 8px 0;
}

.voice-waves span {
  width: 4px;
  height: 8px;
  border-radius: 5px;
  background: #6be8ff;
  animation: wave 1s ease-in-out infinite alternate;
}

.voice-waves span:nth-child(2) { animation-delay: .2s; }
.voice-waves span:nth-child(3) { animation-delay: .4s; }
.voice-waves span:nth-child(4) { animation-delay: .15s; }
.voice-waves span:nth-child(5) { animation-delay: .35s; }

@keyframes wave {
  from { height: 5px; }
  to { height: 20px; }
}

/* ===== 購物網站 ===== */

.shop {
  position: relative;
  isolation: isolate;
  min-height: 510px;
  overflow: hidden;
  margin: 20px 0;
  border: 2px solid #d5e0e8;
  border-radius: 16px;
  background: #f6f8fa;
  color: #243548;
}

.shophead {
  padding: 15px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.shophead strong {
  font-size: 14px;
  color: #244c68;
}

.shopsearch {
  padding: 9px;
  background: #edf3f6;
  border-radius: 9px;
  font-size: 11px;
}

.banner {
  padding: 14px;
  background: linear-gradient(90deg, #ff4c69, #ffab38);
  color: white;
  font-weight: 900;
  text-align: center;
}

.product {
  display: flex;
  gap: 20px;
  padding: 20px;
  background: white;
  color: #26384b;
}

.product-pic {
  width: 115px;
  height: 115px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 15px;
  background: linear-gradient(140deg, #c5f0ff, #f5e0ff);
  font-size: 65px;
}

.price {
  font-size: 27px;
  font-weight: 900;
  color: #e64b56;
}

.shop-description {
  padding: 12px 20px;
}

.shop-description p {
  color: #40566b;
  font-size: 12px;
}

.shop-buy {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
}

.shop-buy button,
.popup-action {
  padding: 10px 13px;
  border: 0;
  border-radius: 8px;
  color: white;
  background: #e64c58;
  font-weight: 800;
}

.shop-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.shop-footer span {
  color: var(--cyan);
  font-size: 13px;
}

/* ===== 不同形式的廣告 ===== */

.popup {
  position: absolute;
  width: clamp(170px, 42%, 245px);
  min-height: 140px;
  max-height: 245px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow: hidden;
  border: 2px solid #f59e54;
  border-radius: 12px;
  background: #fff;
  color: #263448;
  box-shadow: 0 9px 30px #0006;
  animation: popupAppear .25s ease both;
}

.popup strong {
  padding-right: 20px;
  font-size: 13px;
  line-height: 1.35;
}

.popup p {
  margin: 3px 0;
  color: #344c60;
  font-size: 11px;
  line-height: 1.4;
}

.popup .popup-action {
  margin-top: auto;
  font-size: 11px;
  min-height: 31px;
}

.popup-close {
  position: absolute;
  top: 4px;
  right: 5px;
  z-index: 3;
  width: 25px;
  height: 25px;
  border: 0;
  border-radius: 50%;
  background: #243b52;
  color: white;
  font-size: 18px;
}

.popup.visual {
  background: linear-gradient(145deg, #fff3ce, #ffd5e7);
  border: 3px solid #ff8c36;
}

.popup.security {
  background: linear-gradient(145deg, #fff, #ffe3e7);
  border: 3px solid #d83c4c;
}

.popup.flash {
  background: linear-gradient(135deg, #391b64, #b82d76);
  color: white;
  border: 2px solid #ffe25a;
  animation: adFlash .7s ease-in-out infinite alternate;
}

.popup.flash p { color: white; }

.popup.floating {
  background: #e3faff;
  border: 2px solid #35b8d5;
  animation: adFloat 1.8s ease-in-out infinite alternate;
}

.popup.countdown {
  background: linear-gradient(135deg, #fff, #ffdbb1);
  border: 3px solid #ee7a2e;
}

.ad-art {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 60px;
  border-radius: 9px;
  background: radial-gradient(circle, #fff, #b5e4f6);
  font-size: 48px;
}

.ad-art span {
  filter: drop-shadow(0 5px 5px #0004);
}

.ad-discount {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 6px;
  background: #e73d50;
  color: white;
  font-weight: 800;
  font-size: 12px;
}

.ad-countdown {
  color: #b62c36;
  font-size: 17px;
  font-weight: 900;
}

.ad-security-icon {
  text-align: center;
  font-size: 40px;
  animation: adWarning 1s infinite;
}

@keyframes popupAppear {
  from { transform: scale(.75); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes adFlash {
  from {
    box-shadow: 0 0 8px #f4c852;
    filter: brightness(1);
  }
  to {
    box-shadow: 0 0 26px #ffde57;
    filter: brightness(1.23);
  }
}

@keyframes adFloat {
  from { transform: translateY(-5px); }
  to { transform: translateY(8px); }
}

@keyframes adWarning {
  50% { transform: scale(1.14); }
}

/* ===== 電影式漸暗轉場 ===== */

.shop-overlay {
  position: absolute;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 25px;
  background: rgba(1,8,20,.94);
  color: white;
  text-align: center;
  animation: fadeDark 1.1s ease both;
}

.cinematic-message {
  max-width: 530px;
  animation: cinematicEnter 1.2s ease both;
}

.cinematic-message h2 {
  font-size: clamp(23px, 4vw, 35px);
  line-height: 1.7;
}

.cinematic-message h2 span {
  display: block;
  color: var(--cyan);
}

.cinematic-message p {
  color: #cbdbea;
}

.cinematic-loading {
  width: 170px;
  height: 4px;
  margin: 25px auto;
  background: #2d465e;
  overflow: hidden;
  border-radius: 10px;
}

.cinematic-loading div {
  width: 45%;
  height: 100%;
  background: var(--cyan);
  animation: loadingBar 1.8s ease-in-out infinite alternate;
}

@keyframes fadeDark {
  from { background: rgba(1,8,20,0); }
  to { background: rgba(1,8,20,.94); }
}

@keyframes cinematicEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes loadingBar {
  from { transform: translateX(-100%); }
  to { transform: translateX(320%); }
}

/* ===== 響應式 ===== */

@media (max-width: 850px) {
  #app {
    width: calc(100% - 20px);
    margin: 16px auto 100px;
  }

  .layout { display: block; }
  .card { padding: 22px 17px; }
  .intro .card { padding: 40px 22px; }

  .phone-col {
    position: fixed;
    z-index: 500;
    top: 0;
    right: 0;
    width: min(370px, 100%);
    height: 100dvh;
    padding: 10px;
    overflow-y: auto;
    background: #081629;
    transform: translateX(110%);
    transition: transform .3s;
  }

  .phone-col.open {
    transform: translateX(0);
  }

  .phone-col .phone {
    height: min(660px, calc(100dvh - 72px));
    min-height: 450px;
  }

  .phone-backdrop.open {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 490;
    background: #0009;
  }

  .phone-launcher {
    position: fixed;
    z-index: 480;
    bottom: 18px;
    right: 18px;
    display: block;
    padding: 13px 18px;
    border: 1px solid var(--cyan);
    border-radius: 30px;
    background: #17688e;
    color: white;
    box-shadow: 0 8px 25px #0008;
  }
}

@media (max-width: 460px) {
  .stats { gap: 6px; }
  .stat strong { font-size: 22px; }
  .product-pic { width: 85px; height: 85px; font-size: 47px; }
  .shophead { flex-direction: column; align-items: flex-start; }
  .popup { width: 180px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* ===== 第二階段：手機內的林肯影片 ===== */

.lincoln-phone-video {
  display: block;
  width: 100%;
  max-height: 330px;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 12px;
  background: #000;
  border: 1px solid rgba(95, 196, 255, .35);
  margin: 14px 0;
}
</style>
</head>
